<style>
/* Layout idea: a lab notebook for the machine room. Diagram on a dotted circuit-board panel, short text beside it, step bar fixed at the bottom. Diagrams are flat icons (people, companies, data centres, models) wired with circuit-trace connectors. */
:root{
  --paper:#eef2f6; --card:#ffffff; --ink:#13202e; --soft:#566576; --rule:#d5dde6;
  --coral:#2c63f0; --teal:#0b97ae; --mustard:#f0a114; --violet:#d93c74; --stone:#93a3b5;
  --good:#1f8a5b; --bad:#d23c3c; --onacc:#ffffff;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Figtree","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(19,32,46,.06),0 6px 20px rgba(19,32,46,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0b1118; --card:#131c26; --ink:#e7eef6; --soft:#97a6b7; --rule:#273546;
    --coral:#6b95ff; --teal:#2bc0d6; --mustard:#ffbe45; --violet:#ff6f9e; --stone:#56677a;
    --good:#4cc38a; --bad:#ff7a7a; --onacc:#0b1118;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b1118; --card:#131c26; --ink:#e7eef6; --soft:#97a6b7; --rule:#273546;
  --coral:#6b95ff; --teal:#2bc0d6; --mustard:#ffbe45; --violet:#ff6f9e; --stone:#56677a;
  --good:#4cc38a; --bad:#ff7a7a; --onacc:#0b1118;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.brand{white-space:nowrap;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:20px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--coral);box-shadow:14px 0 0 var(--teal),28px 0 0 var(--mustard);margin-right:30px}
.brand span{color:var(--coral)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--soft);text-align:right}
.btn{display:inline-block;text-decoration:none;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.btn:hover{border-color:var(--coral)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--onacc)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.btn.small{padding:6px 13px;font-size:14.5px}
.ic{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:var(--ink);stroke:none}

/* home */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;padding:34px 0 26px}
.hero h1{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:clamp(38px,7vw,66px);line-height:.98;letter-spacing:-.025em;margin:0 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{max-width:46ch;margin:0 0 20px;color:var(--soft)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:8px 0 50px}
.chap{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;border:1px solid var(--rule);border-radius:16px;background:var(--card);padding:16px 16px 14px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.chap:hover{transform:translateY(-2px);border-color:var(--coral)}
.chap .ci{position:absolute;top:14px;right:14px;width:30px;height:30px;color:var(--coral)}
.chap .ci .ic{stroke:currentColor}.chap .ci .ic .f{fill:currentColor}
.chap .num{font-family:var(--mono);font-size:12px;color:var(--soft)}
.chap h3{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:20px;line-height:1.15;margin:0;padding-right:36px;letter-spacing:-.01em}
.chap p{margin:0;font-size:15px;color:var(--soft);flex:1}
.bar{height:6px;border-radius:6px;background:var(--rule);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--coral))}
h2.sec{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:26px;margin:18px 0 6px}
footer{border-top:1px solid var(--rule);padding:16px 0 40px;font-size:14px;color:var(--soft)}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;padding:22px 0 110px;align-items:start}
.stage{border:1px solid var(--rule);border-radius:18px;background:radial-gradient(circle,color-mix(in srgb,var(--soft) 28%,transparent) 1px,transparent 1.5px) 0 0/18px 18px,var(--card);box-shadow:var(--shadow);padding:14px;min-height:260px;position:sticky;top:12px}
.hero>*,.lesson>*{min-width:0}
.dg{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage svg{display:block;width:100%;height:auto;max-height:360px}
.copy h1{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 12px;text-wrap:balance}
.copy p{margin:0 0 12px;max-width:62ch}
.copy .key{border-left:4px solid var(--teal);padding:2px 0 2px 12px;font-weight:700}
.copy small{color:var(--soft);display:block;font-size:14px;line-height:1.45}
.copy b.t{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--teal) 28%,transparent) 60%)}
.copy .w{background:var(--card)}
.rail{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.rail .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;flex:1}
.dots a{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--soft);background:transparent;display:block;transition:width .2s}
.dots a.seen{background:var(--teal);border-color:var(--teal)}
.dots a.on{background:var(--coral);border-color:var(--coral);width:24px}

/* diagram */
.nd{transition:opacity .3s}
.nd.off{opacity:.22}
.nd .tile{fill:color-mix(in srgb,var(--c) 15%,var(--card));stroke:var(--c);stroke-width:1.6}
.nd .ring{fill:none;stroke:var(--c);stroke-width:6;opacity:.22}
.nd .led{fill:var(--c)}
.lb{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.lb.off{opacity:.35}
.ed{fill:none;stroke:var(--soft);stroke-width:1.4;stroke-dasharray:2 5;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.ed.live{stroke:var(--coral);stroke-dasharray:none;opacity:1;stroke-width:2.2}
.ed.block{stroke:var(--bad);stroke-dasharray:4 4;opacity:1;stroke-width:2}
.pk{fill:var(--card);stroke:var(--coral);stroke-width:2.5}
.xmark{font-family:var(--display);font-weight:800;font-size:18px;fill:var(--bad);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px}

/* widgets */
.w{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px}
.w h4{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--soft)}
.w input[type=text],.w select{width:100%;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);padding:10px;font-size:16px}
.w input[type=text]:focus,.w select:focus{border-color:var(--coral);outline:none}
.w input[type=range]{width:100%;accent-color:var(--coral)}
.w label{font-size:14px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:14px;padding:4px 8px;border-radius:7px;border:1px solid color-mix(in srgb,#13202e 25%,transparent);white-space:pre;color:#13202e}
.pb{display:grid;grid-template-columns:78px 1fr 46px;gap:8px;align-items:center;font-family:var(--mono);font-size:13px}
.pb .trk{height:14px;background:var(--card);border:1px solid var(--rule);border-radius:99px;overflow:hidden}
.pb .trk i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s}
.pb.hit .trk i{background:var(--violet)}
.pb span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hint{margin:0;font-weight:700;font-size:14.5px;color:var(--coral)}
.note{font-size:13.5px;color:var(--soft);margin:0}
.out{font-family:var(--mono);font-size:14px;background:var(--card);border:1px dashed var(--soft);border-radius:10px;padding:10px;min-height:42px}
.seg{display:flex;border:1.5px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-size:14px;font-weight:700;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.kv{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:6px 12px;font-size:14.5px;margin:0}
.kv dt{font-family:var(--mono);font-size:12px;color:var(--soft);padding-top:2px}
.kv dd{margin:0}
.map{position:relative;aspect-ratio:1/0.8;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.map button{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--rule);border-radius:99px;background:var(--paper);font-family:var(--mono);font-size:12px;padding:3px 8px}
.map button.sel{background:var(--coral);border-color:var(--coral);color:var(--onacc)}
.map button.near{background:color-mix(in srgb,var(--mustard) 70%,#fff);color:#13202e}
.ctx{display:flex;height:34px;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--card)}
.ctx i{display:block;height:100%;border-right:1px solid var(--card)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);padding:10px 12px}
.opt:hover{border-color:var(--coral)}
.opt.right{background:color-mix(in srgb,var(--good) 20%,var(--card));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}
.doc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font-size:14px;background:var(--card);display:grid;grid-template-columns:1fr auto;gap:8px;opacity:.55}
.doc.top{opacity:1;background:color-mix(in srgb,var(--teal) 14%,var(--card));border-color:var(--teal)}
.doc b{font-family:var(--mono);font-size:12px}
.nest{border:1.5px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:12px;padding:10px;font-family:var(--mono);font-size:12.5px}
.nest>.nest{margin-top:8px}
.big{font-family:var(--display);font-weight:800;font-stretch:110%;font-size:34px;line-height:1}
.tl{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:86px 1fr;gap:10px;border:1px solid var(--rule);border-radius:12px;padding:9px 11px;background:var(--card)}
.li .ld{font-family:var(--mono);font-size:12px;color:var(--soft);padding-top:3px;font-variant-numeric:tabular-nums}
.li p{margin:4px 0;font-size:14.5px}
.li a{font-size:14px;font-weight:700;color:var(--coral)}
.li .rg{font-family:var(--mono);font-size:11.5px;color:var(--soft)}
.st{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:20px;margin-right:4px;color:#13202e}
.st.in{background:color-mix(in srgb,var(--good) 40%,#fff)}
.st.soon{background:color-mix(in srgb,var(--mustard) 65%,#fff)}
.st.prop{background:color-mix(in srgb,var(--stone) 55%,#fff)}
.today{font-family:var(--mono);font-size:12px;text-align:center;color:var(--coral);border-top:2px dashed var(--coral);padding-top:4px}
.tier{display:block;margin:0 auto;border:1.5px solid color-mix(in srgb,#13202e 30%,transparent);border-radius:10px;padding:8px;font-weight:700;color:#13202e;text-align:center}
.tier.sel{outline:3px solid var(--coral);outline-offset:2px}
.cl{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:6px 0;border-bottom:1px solid var(--rule);flex-direction:row}
.cl input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr);padding-top:22px}
  .lesson{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:14px}
  .stage{position:static;min-height:0;padding:10px}
  .stage svg{max-height:300px}
  .dg svg{min-width:470px}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const K=56,R=44;
function P(gx,gy){return [gx*K,gy*R]}
function sz(h){return 44+((h||22)-22)*.75}
function wire(a,b,straight){
  if(straight||a[0]===b[0]||a[1]===b[1])return `M${a[0]} ${a[1]} L${b[0]} ${b[1]}`;
  const m=(a[0]+b[0])/2;return `M${a[0]} ${a[1]} H${m} V${b[1]} H${b[0]}`;
}
function diagram(key,st){
  const d=DG[key],on=st.on?new Set(st.on):null;
  const flow=st.flow==='all'?d.e:(st.flow||[]);
  const live=(a,b)=>flow.some(f=>(f[0]===a&&f[1]===b)||(f[0]===b&&f[1]===a));
  const pos=k=>P(d.n[k][0],d.n[k][1]);
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const k in d.n){const v=d.n[k],[x,y]=pos(k),w=sz(v[4]),ln=v[2]?v[2].split('|').length:0;
    minx=Math.min(minx,x-Math.max(w/2,48));maxx=Math.max(maxx,x+Math.max(w/2,48));
    miny=Math.min(miny,y-w/2-8);maxy=Math.max(maxy,y+w/2+7+ln*13);}
  const vb=[minx-6,miny-6,maxx-minx+12,maxy-miny+12];
  const names=Object.values(d.n).map(v=>v[2].replace(/\|/g,' ')).filter(Boolean).join(', ');
  let s=`<div class="dg"><svg viewBox="${vb.map(n=>n.toFixed(0)).join(' ')}" role="img" aria-label="Diagram: ${names}">`;
  for(const e of d.e){
    const a=pos(e[0]),b=pos(e[1]),blocked=e[2]==='x';
    s+=`<path class="ed ${blocked?'block':live(e[0],e[1])?'live':''}" d="${wire(a,b,d.straight)}"/>`;
    if(blocked)s+=`<text class="xmark" x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2-8}">✕</text>`;
  }
  if(!still)for(const f of flow){
    if(!d.n[f[0]]||!d.n[f[1]])continue;
    s+=`<circle class="pk" r="4.5"><animateMotion dur="1.6s" repeatCount="indefinite" path="${wire(pos(f[0]),pos(f[1]),d.straight)}"/></circle>`;
  }
  let lab='';
  for(const k in d.n){
    const [gx,gy,label,c,h,ic]=d.n[k],w=sz(h),[x,y]=pos(k),isOn=!on||on.has(k),hl=on&&isOn;
    s+=`<g class="nd ${on?(isOn?'on':'off'):''}" style="--c:${COL[c]}">`;
    if(ic==='dot'){
      if(hl)s+=`<circle class="ring" cx="${x}" cy="${y}" r="${w/2+4}"/>`;
      s+=`<circle class="tile" cx="${x}" cy="${y}" r="${w/2}"/>`;
    }else{
      const r=w*.26;
      if(hl)s+=`<rect class="ring" x="${x-w/2-4}" y="${y-w/2-4}" width="${w+8}" height="${w+8}" rx="${r+4}"/>`;
      s+=`<rect class="tile" x="${x-w/2}" y="${y-w/2}" width="${w}" height="${w}" rx="${r}"/>`+
         `<g class="ic" transform="translate(${x-w*.3} ${y-w*.3}) scale(${(w*.6/24).toFixed(3)})">${ICONS[ic]||ICONS.llm}</g>`+
         `<circle class="led" cx="${x+w/2-6}" cy="${y-w/2+6}" r="2.2">${hl&&!still?'<animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>':''}</circle>`;
    }
    s+=`</g>`;
    label.split('|').forEach((t,i)=>{if(t)lab+=`<text class="lb ${on&&!isOn?'off':''}" x="${x}" y="${y+w/2+15+i*13}">${t}</text>`});
  }
  return s+lab+`</svg></div>`;
}

     `Round ${round}. ${sloppy?'Watch the gap between the two bars.':'Only genuinely correct answers are rewarded, so real skill climbs.'}`};

   for(let i=0;i<8;i++){const r=Math.random();if(r<ch){att.push('cheat');cheat++}else if(Math.random()<p){att.push('ok');ok++}else att.push('wrong')}
   p+=.35*(ok/8)*(1-p)+.02*(1-p);
   ch=sloppy?Math.min(.97,ch+.6*(cheat/8+.02)*(1-ch)):Math.max(.01,ch*.7);
   round++;return att};
  $('#rl-go').onclick=()=>draw(step());
  $('#rl-5').onclick=()=>{let a;for(let i=0;i<5;i++)a=step();draw(a)};
  $('#rl-r').onclick=()=>{reset();draw()};
  $('#rl-m').onclick=e=>{if(e.target.dataset.m){sloppy=e.target.dataset.m==='1';reset();draw()}};
  draw();},
 safetymap(el){

 checklist(el){
  const L={me:{n:'For you',i:['I have checked the training setting on every AI app I use','I never paste passwords, ID numbers or other people’s personal details','I check important facts, numbers and quotes against a real source','My family has a code word for urgent money requests, in case of cloned voices','Two-step sign-in is on for my AI and email accounts','I know which agents and connectors can act for me, and what they can reach','Children in my home use age-appropriate AI apps, and we talk about them']},

const CH=[
{s:'basics',t:'What AI actually is',d:'Rules versus learning, and where chatbots sit in the family.',g:'ai',steps:[
 {t:'Old software follows rules',on:['dev','rules','out'],flow:[['dev','rules'],['rules','out']],b:`<p>For decades, software meant a person writing exact rules. <i>If the password is wrong three times, lock the account.</i> The computer does only what the rules say.</p><p>That works for payroll. It fails for “is this a photo of a cat?”, because nobody can write down the rules for cat.</p>`},
 {t:'Machine learning finds the rules itself',on:['data','learn','model'],flow:[['data','learn'],['learn','model']],b:`<p>Instead of rules, you give the computer <b class="t">examples</b>: a million photos labelled cat or not-cat. A learning procedure adjusts itself until its guesses match the labels.</p><p class="key">Nobody tells it what a cat looks like. It works that out from the examples.</p>`},
 {t:'The result is called a model',on:['model','out'],flow:[['model','out']],b:`<p>When learning finishes you are left with a <b class="t">model</b>: a big file of numbers that captures the patterns it found. You can now show it something new and it gives an answer.</p><p>Two phases, then. <b>Training</b> builds the model once. <b>Inference</b> is every time someone uses it.</p>`},
 {t:'Where chatbots fit',w:'family',b:`<p>“AI” is the broad label. Inside it sits machine learning, inside that deep learning, and inside that the <b class="t">large language model</b> or LLM, the thing behind ChatGPT, Claude and Gemini.</p><p>The rest of this guide is about that innermost box.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'What is the main difference between classic software and machine learning?',o:['Machine learning runs on faster computers','Classic software follows written rules; machine learning finds patterns from examples','Machine learning never makes mistakes'],a:1,y:'The rules come out of the data instead of out of a programmer’s head.'},b:`<p>One question before moving on.</p>`}]},
{s:'neurons',t:'Neural networks',d:'Tiny number-makers wired together, with billions of dials.',g:'neurons',steps:[
 {t:'A neuron is a small sum',on:['i1','i2','i3','h2'],flow:[['i1','h2'],['i2','h2'],['i3','h2']],b:`<p>An artificial neuron takes some numbers in, multiplies each by a <b class="t">weight</b>, adds them up, and passes one number on. That is all it does.</p><p>A weight says how much that input matters. Big positive: matters a lot. Negative: counts against.</p>`},
 {t:'Play with one',w:'neuron',b:`<p>Here is a single neuron making a single decision. Flip the inputs and drag the weights.</p><p>Notice that the neuron’s “opinion” lives entirely in the two weights.</p>`},
 {t:'Layers build bigger ideas',flow:'all',b:`<p>Wire thousands of neurons into layers and each layer can combine what the last one found. In an image model, early layers pick out edges, later layers whiskers, later still “cat”.</p><p>Stack many layers and you have <b class="t">deep</b> learning.</p>`},
 {t:'Parameters are the dials',on:['h1','h2','h3'],b:`<p>Every weight is one <b class="t">parameter</b>. When a model is described as having 70 billion parameters, that is 70 billion dials, each set to a particular value during training.</p><p class="key">A model’s knowledge is not stored as sentences. It is smeared across those dials.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'What is a “parameter” in a neural network?',o:['A stored copy of a web page','One adjustable number (a weight) set during training','A rule written by an engineer'],a:1,y:'Billions of these small numbers together are the model.'},b:`<p>One question.</p>`}]},
{s:'tokens',t:'Tokens',d:'How text becomes numbers a network can use.',g:'tokens',steps:[
 {t:'Networks only do arithmetic',on:['text','tok'],flow:[['text','tok']],b:`<p>A neural network cannot read letters. Before anything else, your text is chopped into pieces called <b class="t">tokens</b>.</p><p>A token is often a whole word, sometimes part of a word, sometimes a single comma.</p>`},
 {t:'See it happen',w:'tokenizer',b:`<p>Type a sentence. Short common words stay whole. Long or unusual words get split into reusable chunks, which is how a model copes with words it has never seen.</p>`},
 {t:'Each token gets a number',on:['tok','ids','model'],flow:[['tok','ids'],['ids','model']],b:`<p>The model has a fixed vocabulary, usually somewhere around 50,000 to 200,000 tokens. Each has an ID number. “ cat” might be 9,246.</p><p>The model receives the list of numbers, and gives numbers back, which are turned into text for you.</p>`},
 {t:'Why you should care',b:`<p>Tokens are the unit everything is measured in. Limits on how much a model can read are in tokens. API prices are per million tokens. Speed is tokens per second.</p><p class="key">Rule of thumb in English: 100 tokens is about 75 words.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'Why do models split rare words into several tokens?',o:['To make the text longer','So a limited vocabulary can still spell out any word','Because they cannot handle long words at all'],a:1,y:'A fixed set of pieces can be combined to cover words never seen before.'},b:`<p>One question.</p>`}]},
{s:'predict',t:'Predicting the next word',d:'The single trick behind every chatbot answer.',g:'predict',steps:[
 {t:'An LLM does one thing',on:['prompt','model','probs'],flow:[['prompt','model'],['model','probs']],b:`<p>Give a language model some text and it produces a score for <b class="t">every token in its vocabulary</b>: how likely each one is to come next.</p><p>It does not look anything up. It computes those probabilities from its parameters.</p>`},
 {t:'Then it picks one',w:'nextword',b:`<p>Press “Pick a word” a few times. The likeliest word wins most often, but not always.</p><p><b class="t">Temperature</b> controls how adventurous the pick is. Low: nearly always the top choice. High: surprising, sometimes silly.</p>`},
 {t:'And goes round again',flow:'all',b:`<p>The chosen token is added to the text, and the whole thing goes back in to choose the next one. Hundreds of loops later you have a paragraph.</p><p>That is why answers appear word by word. They are being produced word by word.</p>`},
 {t:'Why this is more than autocomplete',on:['model'],b:`<p>To predict the next word of a physics answer well, a model has to pick up some physics. To continue a proof, some logic. Prediction at this scale forces it to learn a great deal about the world described in text.</p><p class="key">It also explains its worst habit: it produces what is <i>plausible</i>, which is not always what is <i>true</i>.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'You ask the same question twice and get two different answers. Why?',o:['The model was retrained in between','The next token is sampled from probabilities, so there is some randomness','One of the answers came from a search engine'],a:1,y:'With temperature above zero, the pick varies from run to run.'},b:`<p>One question.</p>`}]},
{s:'training',t:'How data trains a model',d:'From a pile of text to a finished model, step by step.',g:'training',steps:[
 {t:'Step 1: collect a mountain of text',on:['web','books','code','clean'],flow:[['web','clean'],['books','clean'],['code','clean']],b:`<p>Training data comes from public web pages, books, code, licensed archives and data written by paid contractors. Some companies also use user conversations where their terms allow it.</p><p>It is filtered first: duplicates, spam and unwanted material are removed.</p>`},
 {t:'Step 2: hide the next word and guess',on:['clean','model','loss'],flow:[['clean','model'],['model','loss']],b:`<p>Take a sentence from the data. Show the model the start and ask for the next token. At first its dials are random, so its guess is rubbish.</p><p>The data itself supplies the right answer, so no human has to label anything. This is called <b class="t">pre-training</b>.</p>`},
 {t:'Step 3: nudge the dials',w:'train',b:`<p>The gap between the guess and the real next word is the <b class="t">error</b> (engineers say “loss”). Maths works out which way to turn each dial to shrink it a little.</p><p>Press the button and watch “blue” rise as the error falls.</p>`},
 {t:'Step 4: repeat trillions of times',on:['dc','model','loss'],flow:[['dc','model'],['model','loss'],['loss','model']],b:`<p>Do that across trillions of tokens, on thousands of specialised chips, for weeks or months. Grammar comes first, then facts, then style, reasoning patterns and code.</p><p>This stage costs the most money and the most electricity.</p>`},
 {t:'What the model keeps',on:['model'],b:`<p>The finished model is a file of numbers. It is <b class="t">not a database</b> of its training text and cannot look a document up. It holds patterns, though heavily repeated passages can sometimes be reproduced.</p><p class="key">It also stops learning. Anything after its training cut-off date is unknown to it unless you tell it.</p>`},
 {t:'Step 5: teach it to be an assistant',on:['model','raters','ft','done'],flow:[['model','ft'],['raters','ft'],['ft','done']],b:`<p>A raw pre-trained model just continues text. <b class="t">Fine-tuning</b> trains it further on example conversations so it answers questions, follows instructions and declines harmful requests.</p><p>People rate its answers, and those ratings steer more training. Then it is tested and released.</p>`},
 {t:'Does chatting train it?',on:['done'],b:`<p>Not live. Your conversation does not change the model while you talk. The weights are frozen once released.</p><p>Whether your chats are <i>saved and used in a future training run</i> is a policy question that depends on the product and your settings. The chapters on versions and on companies cover that.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'During pre-training, where does the “right answer” come from?',o:['A person labels every sentence','The actual next word in the training text','The model asks a search engine'],a:1,y:'The text supplies its own answers, which is why it scales to trillions of words.'},b:`<p>One question.</p>`}]},
{s:'modern',t:'How new models are trained now',d:'The 2026 recipe: pre-training, then a lot of practice with a checker.',g:'modern',steps:[
 {t:'Three stages, not one',flow:'all',b:`<p>The last chapter showed the basic idea. Today’s frontier models go through three stages: <b class="t">pre-training</b> on a huge pile of text, <b class="t">mid-training</b> on a carefully chosen diet, then <b class="t">post-training</b> that turns it into a useful, safe assistant.</p><p>A few years ago post-training was a light finish. Now it takes a large share of the effort and computing power.</p>`},
 {t:'Pre-training: still the foundation',on:['dc','pre'],flow:[['dc','pre']],b:`<p>Next-word prediction over trillions of tokens is still where general knowledge and language come from. The runs use tens or hundreds of thousands of chips.</p><p>The catch: good human-written text is running short. So labs filter harder, license more books and archives, and add <b class="t">synthetic data</b> written by earlier models and then checked.</p>`},
 {t:'Mid-training: a focused diet',on:['pre','mid'],flow:[['pre','mid']],b:`<p>Towards the end of pre-training the mix shifts to high-quality material: code, maths, science, long documents and many languages.</p><p>This is also where models learn to handle very long inputs, the large context windows from earlier.</p>`},
 {t:'Example answers',on:['mid','sft'],flow:[['mid','sft']],b:`<p>Next the model is shown thousands of ideal conversations, written by people or by earlier models and reviewed. It learns the shape of a good answer: follow the instructions, use the right tone, ask when unclear.</p><p>Engineers call this supervised fine-tuning.</p>`},
 {t:'Values and feedback',on:['raters','val','rl'],flow:[['raters','val'],['val','rl']],b:`<p>People, and AI judges guided by written principles, compare pairs of answers and say which is better. The model is trained towards the preferred ones.</p><p>Anthropic writes Claude’s principles into a public <b class="t">constitution</b>, rewritten in January 2026, which explains not only what to value but why. It is used directly in training.</p>`},
 {t:'Practice with a checker',w:'rlsim',b:`<p>The biggest change since 2024 is <b class="t">reinforcement learning with checkable answers</b>. The model gets a task whose result can be verified automatically, like a maths problem with a known answer or code with tests. It tries many times. Attempts that pass are reinforced.</p><p>Run a few rounds and watch real skill climb. Step-by-step reasoning grows out of this kind of practice.</p>`},
 {t:'Practice worlds for agents',on:['rl','check'],flow:[['rl','check']],b:`<p>To train agents, labs build <b class="t">environments</b>: sandboxed computers, codebases, browsers and spreadsheets with a goal and a way to score the result. “Fix this bug so the tests pass.” “Book the cheapest flight that meets these rules.”</p><p>Building thousands of good environments is now an industry of its own.</p>`},
 {t:'When the checker is sloppy',w:'rlsim',sloppy:1,b:`<p>The model only learns what the checker rewards. If the checker can be fooled, the model may learn to fool it. This is <b class="t">reward hacking</b>, and it is a real problem in frontier training, not a thought experiment.</p><p>This version starts with a sloppy checker. Run some rounds and compare the two bars.</p>`},
 {t:'Testing, then smaller copies',on:['eval','rel'],flow:[['rl','eval'],['eval','rel']],b:`<p>Before release the model goes through safety testing (next chapters). The large model is also used to teach smaller, cheaper ones, which is <b class="t">distillation</b>.</p><p>Then the weights are frozen and released as a version. Further learning happens only in the next training run.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'What is reward hacking?',o:['Stealing a model’s weights','A model learning to fool the checker instead of doing the task properly','Paying people to rate answers'],a:1,y:'The model optimises what is measured, so the measurement has to be right.'},b:`<p>One question.</p>`}]},
{s:'meaning',t:'Meaning and attention',d:'How a model knows that “bank” can be a river or a loan.',g:'tokens',steps:[
 {t:'Words become coordinates',w:'embed',b:`<p>Each token is turned into a long list of numbers called an <b class="t">embedding</b>. Think of it as a position on a map where similar meanings sit close together.</p><p>Tap a word to find its neighbours.</p>`},
 {t:'Context changes meaning',w:'attention',b:`<p>A word’s meaning depends on its neighbours. <b class="t">Attention</b> lets every token look at every other token and decide which ones matter for understanding it.</p><p>Switch the ending and watch “it” change its mind.</p>`},
 {t:'The transformer',on:['ids','model'],flow:[['ids','model']],b:`<p>Stack dozens of attention layers and you have a <b class="t">transformer</b>, the design from 2017 that every major LLM uses. The T in GPT stands for it.</p><p>Its advantage: it processes all tokens at once, so it trains efficiently on enormous amounts of text.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'What does attention do?',o:['Stores the conversation on disk','Lets each word weigh the other words to work out its meaning in context','Checks facts against the internet'],a:1,y:'It is how “it” gets linked to the right noun.'},b:`<p>One question.</p>`}]},
{s:'context',t:'The context window',d:'Why a chatbot forgets, and what “memory” really is.',g:'context',steps:[
 {t:'The model has no memory',on:['msg','win','model','out'],flow:[['msg','win'],['win','model'],['model','out']],b:`<p>A model answers from two things only: its frozen parameters, and the text in front of it right now. That text is the <b class="t">context window</b>.</p><p>Between one request and the next it remembers nothing.</p>`},
 {t:'So the whole chat is re-sent',flow:'all',b:`<p>Each time you press send, the app quietly sends everything again: hidden instructions from the app maker, the full conversation so far, any files, then your new message.</p><p>The model reads it all from the top, every time.</p>`},
 {t:'The window has a size',w:'context',b:`<p>Windows are measured in tokens. Modern ones hold hundreds of thousands, a few hold a million or more. This toy one holds 1,000 so you can fill it.</p><p>Keep sending and watch what happens to the oldest messages.</p>`},
 {t:'What “memory” features do',on:['sys','hist','win'],flow:[['sys','win'],['hist','win']],b:`<p>When an app remembers you across chats, the model has not changed. The app saved some notes about you and <b class="t">pastes them back into the window</b> at the start of the next chat.</p><p class="key">Everything a model knows about you is either in the window or it is not known.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'In a very long chat the assistant forgets something from the start. The likeliest reason?',o:['It got tired','The early text no longer fits in the context window','It was retrained mid-chat'],a:1,y:'Once text falls outside the window the model cannot see it.'},b:`<p>One question.</p>`}]},
{s:'rag',t:'RAG: giving a model your documents',d:'Retrieval-augmented generation without the jargon.',g:'rag',steps:[
 {t:'The problem',on:['q','model'],flow:[['q','model']],b:`<p>A model knows what was in its training data up to its cut-off date. It has never seen your company handbook, last week’s sales figures or your inbox.</p><p>Ask anyway and it may produce a confident guess.</p>`},
 {t:'Step 1: index the documents once',on:['docs','store'],flow:[['docs','store']],b:`<p>Your documents are cut into short <b class="t">chunks</b>, a paragraph or so each. Every chunk is turned into an embedding, its coordinates on the map of meaning, and stored in a search index (often called a vector database).</p>`},
 {t:'Step 2: retrieve at question time',on:['q','store','find'],flow:[['q','find'],['store','find']],b:`<p>When a question arrives it is embedded too. The index returns the chunks whose coordinates are closest, meaning the passages most likely to be relevant, even if they use different words.</p>`},
 {t:'Step 3: put them in the prompt',on:['find','model','ans'],flow:[['find','model'],['model','ans']],b:`<p>Those chunks are pasted into the context window above the question, with an instruction like “answer using only these sources”. The model then writes an answer and can point to where each fact came from.</p><p class="key">Retrieval + Augmenting the prompt + Generation = RAG.</p>`},
 {t:'Try it',w:'rag',b:`<p>Pick a question. See which chunks score highest, and how the answer cites them.</p><p>The model has learned nothing. It read two paragraphs just before answering.</p>`},
 {t:'RAG or fine-tuning?',flow:'all',b:`<p><b>RAG</b> hands the model facts at question time. Update a document and the next answer changes. Access can follow each person’s permissions.</p><p><b>Fine-tuning</b> changes the dials. It is better for teaching a style or a skill than for facts that keep changing.</p><p>Most company “chat with our documents” tools are RAG.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'In RAG, how does the model “know” your company policy?',o:['It was retrained on the policy','The relevant passage was fetched and placed in its context window','It memorised it from an earlier chat'],a:1,y:'The knowledge lives in the documents, not in the model.'},b:`<p>One question.</p>`}]},
{s:'agents',t:'Tools and agents',d:'How a text predictor ends up searching, coding and clicking.',g:'agents',steps:[
 {t:'A model can only write text',on:['user','model'],flow:[['user','model']],b:`<p>On its own an LLM cannot browse, calculate reliably, send an email or check today’s date. All it can do is produce tokens.</p>`},
 {t:'So it writes a request',on:['model','search'],flow:[['model','search']],b:`<p>The app tells the model which <b class="t">tools</b> exist. When the model decides it needs one, it writes a small structured note, such as “search the web for: train times London to Leeds”.</p><p>The app, not the model, runs the search and pastes the results back into the window.</p>`},
 {t:'Loop that and you have an agent',flow:'all',b:`<p>An <b class="t">agent</b> is a model working in a loop: decide a step, call a tool, read the result, decide the next step, until the job is done.</p><p>That is how AI can now fix a bug across many files or research a topic over dozens of pages.</p>`},
 {t:'Connectors',on:['model','apps'],flow:[['model','apps']],b:`<p>Connectors plug a model into your email, calendar, files or company systems. A shared standard called the Model Context Protocol (MCP) means one connector works across many AI apps.</p>`},
 {t:'The new risks',on:['apps','search'],b:`<p>An agent that can act can act wrongly. Two things to know:</p><p><b>Permissions.</b> It should have only the access the task needs, and ask before anything irreversible.</p><p><b>Prompt injection.</b> A web page or email can contain text written to hijack the agent. Good systems treat what they read as information, never as orders.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'When a chatbot “searches the web”, what actually runs the search?',o:['The neural network itself','The app around the model, after the model asks for it','Nobody, the answer is invented'],a:1,y:'The model writes the request; ordinary software carries it out.'},b:`<p>One question.</p>`}]},
{s:'api',t:'APIs and MCP',d:'How apps talk to a model, and how a model reaches your tools.',g:'api',steps:[
 {t:'The chat app is only one door',on:['app','api','model'],flow:[['app','api'],['api','model']],b:`<p>When a bank’s website, a coding tool or a customer-service bot “has AI in it”, it is usually not running its own model. It is calling someone else’s over the internet through an <b class="t">API</b>.</p><p>API means application programming interface: a fixed way for one program to ask another for something.</p>`},
 {t:'What a request looks like',w:'apireq',b:`<p>The app sends a small structured message and gets the model’s reply back as data. Flip between the three versions.</p><p>Notice there is no memory here either. The app sends the whole conversation each time.</p>`},
 {t:'The key and the meter',on:['api','meter'],flow:[['api','meter']],b:`<p>Each request carries an <b class="t">API key</b>, a long secret password that identifies the customer. Leak it and someone else can spend your money.</p><p>The provider counts tokens in and tokens out, and bills for both.</p>`},
 {t:'Price up a request',w:'bill',b:`<p>Output tokens usually cost several times more than input tokens, because writing takes more computing than reading.</p><p>Drag the sliders. One request is tiny. Volume is what makes the bill.</p>`},
 {t:'MCP: a standard plug for tools',on:['model','mcp','tool'],flow:[['model','mcp'],['mcp','tool']],b:`<p>The API connects an app to a model. <b class="t">MCP</b>, the Model Context Protocol, connects a model to everything else: files, calendars, databases, company systems.</p><p>Think of it as USB for AI. Before it, every app needed a custom connection to every tool.</p>`},
 {t:'How an MCP server works',on:['mcp','tool'],flow:[['mcp','tool']],b:`<p>An MCP <b>server</b> is a small program that sits in front of a tool and announces: here is what I can do, and here is how to ask. For a calendar: list events, create event, find a free slot.</p><p>Any AI app that speaks MCP can plug in and use it without new code. One server, many apps.</p>`},
 {t:'API or MCP?',flow:'all',b:`<p class="key">API: how software reaches the model. MCP: how the model reaches software.</p><p>They work together. A company app calls the model by API, and the model uses MCP connectors to read the company’s data, with whatever permissions the admin allowed.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'What does MCP standardise?',o:['How models are trained','How a model connects to outside tools and data','How much a token costs'],a:1,y:'Build a connector once and any MCP-aware app can use it.'},b:`<p>One question.</p>`}]},
{s:'models',t:'How LLMs differ',d:'Big and small, open and closed, thinking and multimodal.',g:'llms',steps:[
 {t:'Same recipe, different sizes',on:['small','mid','big'],b:`<p>Nearly all LLMs share the transformer design. They differ in size, training data, the fine-tuning that shapes their behaviour, and the tools built around them.</p><p>Most makers sell a family: a small fast model, a mid one, a large one.</p>`},
 {t:'Size is a trade-off',w:'size',b:`<p>More parameters usually means more capable, and also slower and more expensive per answer. Slide to compare.</p><p class="key">The biggest model is the wrong choice for most routine jobs.</p>`},
 {t:'Closed or open',on:['open','closed'],b:`<p><b class="t">Closed</b> models (Claude, GPT, Gemini) stay on the maker’s servers. You rent access through an app or API.</p><p><b class="t">Open-weight</b> models (Llama, Mistral, DeepSeek, Qwen and others) can be downloaded and run on your own machines. More control and privacy, more engineering work, and usually a step behind the very best.</p>`},
 {t:'Thinking modes',on:['big'],b:`<p>Many current models can <b class="t">reason before answering</b>: they write out working in a scratchpad, check it, then reply. Better on maths, planning and code. Slower, and it uses more tokens and energy.</p>`},
 {t:'More than text',on:['mid','big'],b:`<p><b class="t">Multimodal</b> models accept images, audio or video as well as text, by turning those into tokens too. Image and video <i>generators</i> are usually a different kind of model, called diffusion, which starts from noise and refines it into a picture.</p>`},
 {t:'How to choose',b:`<p>Ignore the league tables at first. Ask four things. How hard is the task? How fast must it answer? What can it cost per use? Where is the data allowed to go?</p><p>Then test two or three models on your own real examples.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'A company must keep all data on its own servers. Which kind of model fits best?',o:['An open-weight model it runs itself','Any consumer chatbot app','The largest closed model available'],a:0,y:'Open weights can run entirely inside the company’s own hardware.'},b:`<p>One question.</p>`}]},
{s:'prices',t:'Why tokens keep getting cheaper',d:'New models arrive, old quality gets cheap, and bills still grow.',g:'prices',steps:[
 {t:'The price of the same quality collapses',w:'deflate',b:`<p>Hold the quality fixed and watch the price. Venture firm a16z measured about a tenfold fall every year. Research group Epoch AI found between 9× and 900× a year depending on the task.</p><p>Few technologies have ever become cheap this quickly.</p>`},
 {t:'Reason 1: better chips',on:['chips','price'],flow:[['chips','price']],b:`<p>Each generation of AI chips does more arithmetic per watt and per dollar. The same data centre can answer more prompts, so each one costs less to serve.</p>`},
 {t:'Reason 2: smaller models catch up',on:['small','price'],flow:[['small','price']],b:`<p>This is the big one. Engineers learn to pack last year’s ability into a much smaller model, partly by having a large model teach a small one (<b class="t">distillation</b>).</p><p class="key">Last year’s flagship quality becomes this year’s budget tier.</p>`},
 {t:'Reason 3: smarter software',on:['soft','price'],flow:[['soft','price']],b:`<p>Tricks in how models are run: storing numbers at lower precision, answering many users in one batch, and <b class="t">caching</b>, where a long prompt that repeats is processed once and reused at a discount.</p><p>Plus plain competition. Many providers, and open models anyone can host, push prices toward cost.</p>`},
 {t:'What happens to the old model',on:['price'],b:`<p>When a new model launches, the old one usually goes one of three ways. Its price is cut. Or a newer, smaller model matches it for less, so people switch. Or it is <b class="t">retired</b> on an announced date and switched off.</p><p>Old models are rarely kept for ever, because the chips they occupy are needed for new ones.</p>`},
 {t:'Why bills still go up',on:['price','use'],flow:[['price','use']],b:`<p>Two catches. The <b>newest, best</b> models are not cheap. They launch at premium prices, and some cost more than what they replace.</p><p>And modern use burns far more tokens: thinking modes, long documents, agents that loop for an hour. Price per token falls while tokens per task climbs.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'A new flagship model launches. What usually happens to the quality level of the previous one?',o:['It becomes more expensive because it is rare','It becomes available more cheaply, often in a smaller model','It keeps improving by itself'],a:1,y:'Yesterday’s top tier becomes today’s budget option.'},b:`<p>One question.</p>`}]},
{s:'versions',t:'Versions, updates and your data',d:'Does a released model keep learning? Does the next one learn from you?',g:'versions',steps:[
 {t:'A version is a snapshot',on:['d1','v1'],flow:[['d1','v1']],b:`<p>Once a model is released, its training has stopped. The weights are frozen. A name like “Opus 5.5” points at one fixed file of numbers.</p><p>It does not get smarter week by week, and it does not learn from the people using it.</p>`},
 {t:'So why does it seem to change?',on:['v1','you'],flow:[['v1','you']],b:`<p>The product around the model changes. The hidden instructions get edited, new tools and search are added, safety filters are tuned.</p><p>Same engine, different car. And because answers are sampled, two identical questions can differ anyway.</p>`},
 {t:'The next version is a new training run',on:['d2','v2'],flow:[['d2','v2']],b:`<p>A new version is not the old one topped up with fresh facts. It is trained again, often from scratch or from an earlier stage, with more data, a later cut-off date and improved methods.</p><p>Then it is tested and released as a new frozen snapshot. The old one carries on unchanged until it is retired.</p>`},
 {t:'Your question: I told 5.5 something. Does the next Opus know it?',w:'mydata',b:`<p><b>Not automatically.</b> What you type sits in the context window for that chat and is gone from the model’s view afterwards. Nothing flows from your chat into the weights.</p><p>The only route is the slow one: your chat is saved, the rules allow it to be used, and it becomes one example among billions in a later training run. Pick your situation.</p>`},
 {t:'Even then, it does not “know you”',on:['you','store','d2'],flow:[['you','store'],['store','d2']],b:`<p>If a chat is used in training, the new model does not receive a file about you. It is nudged by your text the same way it is nudged by any page, a tiny amount, toward general patterns.</p><p class="key">It would not recall your project or your name the way a person would. Rare, repeated or unusual text is the exception, which is why secrets should stay out regardless.</p>`},
 {t:'What this means in practice',flow:'all',b:`<p>A new version will not remember your old conversations. Bring your context with you: documents, instructions, or a memory feature that pastes notes back in.</p><p>If you do not want your chats used, turn the setting off or use a work plan. If you already shared something you regret, delete that chat.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'You explain your business to a model today. A new version launches next year. Does it know your business?',o:['Yes, models update themselves from every chat','No, unless that chat was saved and used in training, and even then only as faint general patterns','Yes, but only if you used the same account'],a:1,y:'Released models are frozen, and future training is governed by data settings.'},b:`<p>One question.</p>`}]},
{s:'enterprise',t:'Claude inside a big company',d:'What “private” AI means when a business rolls it out.',g:'ent',steps:[
 {t:'The worry',on:['emp','claude','train'],flow:[['emp','claude']],b:`<p>A bank wants its staff to use Claude. The fear is simple: will our contracts and customer data be stored somewhere we cannot see, or end up teaching a model that our competitors also use?</p>`},
 {t:'Same model, different contract',w:'privacy',b:`<p>There is no separate “private Claude” brain. The company gets the same model under <b class="t">commercial terms</b> with different data rules and controls.</p><p>Compare the three ways in.</p>`},
 {t:'Not used for training',on:['claude','train'],b:`<p>This is the core promise. On Anthropic’s commercial products, prompts and replies are not used to train models by default. A company would have to opt in.</p><p class="key">The model that answers on Friday is the same frozen model as on Monday. It did not learn the bank’s secrets in between.</p>`},
 {t:'Getting in: the company login',on:['emp','admin','sso','ws'],flow:[['emp','sso'],['sso','ws'],['admin','ws']],b:`<p>Staff sign in with their normal work account (single sign-on). When someone leaves, their access ends with their work account. Admins decide who gets in, which features are on and which tools are allowed.</p>`},
 {t:'Using company knowledge',on:['ws','data','claude'],flow:[['ws','data'],['ws','claude']],b:`<p>Connectors link Claude to the company’s documents, chat and databases. This is the RAG and tools pattern from earlier: relevant material is fetched <b class="t">at question time</b> and placed in the context window.</p><p>It respects each person’s existing permissions, so an intern cannot ask their way into board papers.</p>`},
 {t:'Where it runs',on:['ws','claude'],flow:[['ws','claude']],b:`<p>Two routes. Directly with Anthropic, through Claude’s apps or API. Or through a cloud the company already uses: Amazon Bedrock, Google Cloud or Microsoft Foundry, where requests are handled inside that provider’s environment under its own data terms.</p><p>Banks and hospitals often pick the second because their security reviews already cover that cloud.</p>`},
 {t:'What is kept, and who can see it',on:['ws','logs'],flow:[['ws','logs']],b:`<p>Commercial API data is typically deleted within 30 days. Enterprise plans let admins set retention. Approved customers can have <b class="t">zero data retention</b>, where prompts are not stored after the reply, apart from what law or misuse prevention requires.</p><p>Audit logs record who did what, which regulators and security teams expect.</p>`},
 {t:'What still goes wrong',on:['emp'],b:`<p>The contract does not fix everything. Staff paste confidential text into personal accounts. Connectors are given broader access than they need. People trust an answer nobody checked.</p><p>“Private” describes where data goes. It does not make the answers correct.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'A company connects Claude to its document store. How does Claude use those documents?',o:['It is retrained on them overnight','Relevant passages are fetched when someone asks, and read in the context window','They are added to the public model'],a:1,y:'Retrieval at question time, not learning.'},b:`<p>One question.</p>`}]},
{s:'energy',t:'Energy',d:'Where the electricity goes, and how much a prompt really uses.',g:'energy',steps:[
 {t:'Where the power goes',on:['grid','dc','cool'],flow:[['grid','dc'],['dc','cool']],b:`<p>AI runs in data centres packed with specialised chips (GPUs). Each chip does billions of multiplications a second and turns almost all its electricity into heat.</p><p>So energy is spent twice: running the chips, then cooling them, which often uses water too.</p>`},
 {t:'Training: one enormous burst',on:['dc','train'],flow:[['dc','train']],b:`<p>Training a frontier model keeps thousands of chips busy for weeks or months. Estimates for a single run reach into gigawatt-hours, the yearly electricity of hundreds or thousands of homes.</p><p>It happens once per model, though failed experiments along the way add more.</p>`},
 {t:'Answering: tiny, times billions',on:['dc','serve','you'],flow:[['dc','serve'],['serve','you']],b:`<p>Each answer is small. Google measured its median Gemini text prompt at <b class="t">0.24 watt-hours</b>, about nine seconds of television. But there are billions of prompts a day, so answering now outweighs training in total.</p>`},
 {t:'Work out your own',w:'energy',b:`<p>Move the slider. For ordinary text questions, personal use is small next to a kettle or a car journey.</p><p>The picture changes with long reasoning tasks, agents that run for hours, and image or video generation.</p>`},
 {t:'The big picture',on:['grid','dc'],flow:[['grid','dc']],b:`<p>The International Energy Agency put all data centres at about 415 TWh in 2024, roughly 1.5% of the world’s electricity, and projects around 945 TWh by 2030, with AI the main driver.</p><p class="key">The strain is local. One large site can need as much power as a city, in a place whose grid was not built for it.</p>`},
 {t:'What brings it down',flow:'all',b:`<p>Better chips, smaller models for simple jobs, reusing repeated work (caching), and cleaner electricity. Google reported the energy per Gemini prompt fell 33-fold in one year.</p><p>Efficiency per prompt is improving fast. Total demand is still rising because usage grows faster.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'Which uses more energy in total today?',o:['A single training run','Answering billions of everyday prompts','Tokenising text'],a:1,y:'Each prompt is tiny, but the volume is enormous.'},b:`<p>One question.</p>`}]},
{s:'limits',t:'Where it goes wrong',d:'Five failure modes worth knowing before you rely on it.',g:'limits',steps:[
 {t:'It makes things up',on:['model','ans'],flow:[['model','ans']],b:`<p>A model generates what is plausible. When it lacks the fact, it can produce a fluent, confident and wrong answer, including fake quotes and references. This is called <b class="t">hallucination</b>.</p><p>It is less common than it was, and it has not gone away.</p>`},
 {t:'It is stuck in the past',on:['q','model'],b:`<p>Without search or documents, a model knows nothing after its training cut-off, and may not realise that time has moved on. Ask about anything recent only when it can look things up.</p>`},
 {t:'It inherits bias',on:['model'],b:`<p>Training text was written by people, with their blind spots and stereotypes. Models absorb some of that. Makers work to reduce it, and it still shows up in subtle ways.</p>`},
 {t:'It can be steered',on:['q','model'],flow:[['q','model']],b:`<p>Wording matters. Leading questions get agreeable answers. Text hidden in a document can try to redirect an agent. A model is not a neutral oracle.</p>`},
 {t:'Your part',flow:'all',b:`<p class="key">Treat it as a quick, well-read colleague who is sometimes wrong and never tells you when.</p><p>Ask for sources and open them. Check numbers. Be most careful with medical, legal and financial questions. Keep a person responsible for the outcome.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'A model gives you a confident answer with a citation. What should you do?',o:['Trust it, citations are always real','Open the source and confirm it says that','Ask the same question again and trust the second answer'],a:1,y:'Citations can be invented or misread, so the source is the check.'},b:`<p>One question.</p>`}]},
{s:'risks',t:'Risks',d:'The wider risks of AI, and what you can do about each.',g:'risks',steps:[
 {t:'Two kinds of risk',on:['tech','people','soc'],flow:[['tech','people'],['tech','soc']],b:`<p>The last chapter covered a model getting things wrong. This one is about what happens when it works well, in the wrong hands or at the wrong scale.</p><p>Some risks land on you personally. Others fall on society as a whole.</p>`},
 {t:'Explore them',w:'risklist',b:`<p>Seven that come up most. For each: what it is and what reduces it.</p>`},
 {t:'Who is responsible',on:['people','soc','guard'],flow:[['people','guard'],['soc','guard']],b:`<p><b>Makers</b> test models before release, block clearly harmful uses and watch for abuse. <b>Companies</b> deploying AI decide what it can access and who checks its work. <b>Governments</b> are writing rules, such as the EU’s AI Act, which sets duties by level of risk.</p><p>None of the three is enough alone.</p>`},
 {t:'A sensible attitude',flow:'all',b:`<p>Neither panic nor blind trust. Most everyday use is low-stakes and helpful. Risk rises with three things: how much the system can <b>do</b>, how much it can <b>access</b>, and how little anyone <b>checks</b>.</p><p class="key">Raise oversight as you raise autonomy.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'You are setting up an AI agent to tidy your inbox. Which setup is safest?',o:['Full access to email, files and payments, no approvals','Access to email only, with approval before sending or deleting','No difference, agents cannot make mistakes'],a:1,y:'Least access plus approval for irreversible actions.'},b:`<p>One question.</p>`}]},
{s:'safety',t:'Safety: what companies do',d:'The layers between a powerful model and harm, and what you can do yourself.',g:'safety',steps:[
 {t:'Why companies bother',flow:'all',b:`<p>A model that can help a researcher design a vaccine can, in principle, help someone else do harm. A model that finds software bugs for defenders can find them for attackers. The capability is the same; the use differs.</p><p>So companies put several layers between the model and the world. Laws now require some of this, and customers ask for it.</p>`},
 {t:'Layer 1: clean the data',on:['data','train'],flow:[['data','train']],b:`<p>Before training, the riskiest material, such as detailed weapons information, is filtered out of the data, along with spam, abuse imagery and large amounts of personal information.</p><p>A model cannot easily repeat what it never saw.</p>`},
 {t:'Layer 2: train good values',on:['train','model'],flow:[['train','model']],b:`<p>Post-training teaches the model to refuse clearly harmful requests, be honest about uncertainty and handle sensitive topics with care.</p><p>Claude’s constitution sets out priorities in order: be broadly safe, meaning do not undermine human oversight; be ethical; follow Anthropic’s guidelines; and be genuinely helpful.</p>`},
 {t:'Layer 3: test for danger',on:['model','eval','ext'],flow:[['model','eval'],['ext','eval']],b:`<p>Before release, teams try to make the model misbehave. This is <b class="t">red-teaming</b>. They also run dangerous-capability tests: can it meaningfully help with biological weapons, serious cyberattacks, or copying itself out of its servers?</p><p>Government testers such as the UK AI Security Institute and the US CAISI test models too. Results go in a public <b class="t">system card</b>.</p>`},
 {t:'Layer 4: if-then rules',on:['eval','model'],b:`<p>Leading labs publish frameworks of the form: <i>if a model reaches capability X, we must have safeguards Y before releasing it.</i></p><p>Anthropic calls its version the Responsible Scaling Policy, with AI Safety Levels. OpenAI has a Preparedness Framework and Google DeepMind a Frontier Safety Framework. The strongest models may go only to vetted partners at first.</p>`},
 {t:'Layer 5: guard the live model',on:['model','guard','user','sec'],flow:[['model','guard'],['guard','user'],['model','sec']],b:`<p>After release: classifiers that screen for the most dangerous requests, usage policies, monitoring for abuse, and banning accounts that misuse the model. This is one reason commercial data is kept for a short period.</p><p>Behind it all, the weights file is locked down so it cannot be stolen and stripped of these protections.</p>`},
 {t:'What each layer is for',w:'safetymap',b:`<p>Pick a worry to see the matching safeguards, and why each one is hard to get right.</p>`},
 {t:'The honest limits',on:['model'],b:`<p>Most of these commitments are voluntary, and companies race each other. Tests can miss things. Clever prompts, called <b class="t">jailbreaks</b>, still get past safeguards sometimes. Open-weight models, once published, cannot be recalled or patched.</p><p class="key">This is why outside testing, transparency reports and laws matter: they check the checkers.</p>`},
 {t:'What you should think about',w:'checklist',b:`<p>Company safeguards cover the model. You cover how it is used. Tick off what you already do.</p><p>The organisation list is a good starting point for a workplace AI policy.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'What is a “system card”?',o:['A payment card for AI subscriptions','A public report of a model’s safety tests and their results','The chip a model runs on'],a:1,y:'It is published at release so outsiders can see what was tested.'},b:`<p>One question.</p>`}]},
{s:'laws',t:'AI laws: now and next',d:'What is in force, what is coming, and links to read them.',g:'laws',steps:[
 {t:'Why laws, and why now',flow:'all',b:`<p>For years AI was governed mostly by companies’ own promises. Since 2024, governments have moved: some to protect people, some to stay competitive, many to do both.</p><p>Three regions matter most for you: the EU, the US and Asia. The UK is still deciding.</p>`},
 {t:'The EU: rules by level of risk',on:['eu'],w:'eutiers',b:`<p>The <b class="t">EU AI Act</b> is the world’s most comprehensive AI law. It does not regulate “AI” in general. It sorts uses by risk, and stricter rules apply higher up.</p><p>It applies to anyone offering AI to people in the EU, wherever the company is based. Tap each level.</p>`},
 {t:'The US: states first, Washington pushing back',on:['states','fed'],b:`<p>There is no broad federal AI law. States moved first. California’s SB 53, in force since January 2026, makes the biggest developers publish safety frameworks and report serious incidents. New York’s RAISE Act follows in January 2027.</p><p>The White House wants one national standard that would override most state rules and has asked Congress to write it. Several bills are drafted; none has passed. Federal law does already cover sexual deepfakes, through the TAKE IT DOWN Act.</p>`},
 {t:'The UK and Asia',on:['uk','asia'],b:`<p><b>UK:</b> no dedicated AI law. The government relies on existing regulators and its AI Security Institute, which tests models.</p><p><b>South Korea</b> brought in a full AI law in January 2026. <b>China</b> requires labels on all AI-generated content. <b>Japan</b> passed a lighter law that promotes AI without fines.</p>`},
 {t:'Every law, with links',w:'laws',b:`<p>The full list in date order. The dashed line marks today. Filter by region, and open any law to read it.</p>`},
 {t:'What this means for you',on:['co'],b:`<p>As a user in Europe you now have a right to know when you are talking to a chatbot, and to see deepfakes labelled. In the US you can demand removal of intimate deepfakes within 48 hours.</p><p>At work: if AI helps decide who gets hired, a loan or a school place, expect more checks, records and human review from 2027. And every organisation using AI in the EU should already be training its staff.</p>`},
 {t:'Check yourself',w:'quiz',q:{q:'Under the EU AI Act, which rule already applies to a customer-service chatbot today?',o:['It must be registered as high-risk','It must tell people they are talking to AI','It is banned'],a:1,y:'Transparency duties have applied since 2 August 2026.'},b:`<p>Last question. You have reached the end of the guide.</p>`}]}
];

/* ---------- app ---------- */
const app=$('#app');
let seen={};try{seen=JSON.parse(localStorage.getItem('haw-seen')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('haw-seen',JSON.stringify(seen))}catch(e){}};
function route(){
  const m=location.hash.slice(1).match(/^([a-z]+)(?:-(\d+))?$/);
  const ci=m?CH.findIndex(c=>c.s===m[1]):-1;
  if(ci<0){home();return}
  lesson(ci,Math.min(Math.max(+(m[2]||1),1),CH[ci].steps.length));
}
const CI={basics:'llm',neurons:'gear',tokens:'tokens',predict:'dice',training:'book',modern:'check',meaning:'globe',context:'window',rag:'search',agents:'terminal',api:'plug',models:'chart',prices:'coin',versions:'calendar',enterprise:'co',energy:'bolt',limits:'alert',risks:'people',safety:'shield',laws:'gov'};
function home(){
  $('#crumb').textContent=CH.length+' chapters, one diagram at a time';
  const total=CH.reduce((a,c)=>a+c.steps.length,0),done=CH.reduce((a,c)=>a+Math.min(seen[c.s]||0,c.steps.length),0);
  const next=CH.find(c=>(seen[c.s]||0)<c.steps.length)||CH[0];
  app.innerHTML=`<section class="hero"><div><p class="eyebrow">An interactive guide for complete beginners</p>
   <h1>How <em>AI</em> actually works</h1>
   <p>Chatbots, training data, RAG, private company setups and the electricity bill. Each idea is one diagram and a few plain sentences. Step through, and poke the parts that move.</p>
   <a class="btn primary" href="#${next.s}-${Math.min((seen[next.s]||0)+1,next.steps.length)}">${done?'Continue: '+next.t:'Start at chapter 1'}</a>
   <p class="eyebrow" style="margin-top:18px">${done} of ${total} steps done</p></div>
   <div class="stage" style="position:static">${diagram('training',{flow:'all'})}</div></section>
   <h2 class="sec">Chapters</h2>
   <div class="grid">${CH.map((c,i)=>`<a class="chap" href="#${c.s}-1"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><g class="ic">${ICONS[CI[c.s]]||ICONS.llm}</g></svg><span class="num">${String(i+1).padStart(2,'0')} · ${c.steps.length} steps</span><h3>${c.t}</h3><p>${c.d}</p><div class="bar"><i style="width:${Math.min((seen[c.s]||0)/c.steps.length,1)*100}%"></i></div></a>`).join('')}</div>
   <footer>Figures: energy per prompt from Google’s August 2025 measurement of Gemini; data-centre totals from the International Energy Agency’s 2025 Energy and AI report; Claude data handling from Anthropic’s published commercial terms, consumer terms update (August 2025) and privacy pages; price trends from a16z (2024) and Epoch AI (2025); training methods from Anthropic’s published constitution and industry reporting; laws as listed in the Laws chapter, checked 25 November 2026. Interactive demos are simplified models of the real thing and say so where it matters. Visits are counted with GoatCounter, which uses no cookies and collects no personal data.</footer>`;
  window.scrollTo(0,0);
}
function lesson(ci,n){
  const c=CH[ci],st=c.steps[n-1];
  seen[c.s]=Math.max(seen[c.s]||0,n);save();
  $('#crumb').textContent=`${String(ci+1).padStart(2,'0')} ${c.t} · step ${n} of ${c.steps.length}`;
  const prev=n>1?`#${c.s}-${n-1}`:ci>0?`#${CH[ci-1].s}-${CH[ci-1].steps.length}`:'#';
  const last=n===c.steps.length,nx=!last?`#${c.s}-${n+1}`:ci<CH.length-1?`#${CH[ci+1].s}-1`:'#';
  const hasDiagram=!st.w||st.on||st.flow;
  app.innerHTML=`<section class="lesson">
   <div class="stage" id="stage">${st.w&&!hasDiagram?'':diagram(c.g,st)}<div id="widget"></div></div>
   <div class="copy"><p class="eyebrow">Chapter ${ci+1} · ${c.t}</p><h1>${st.t}</h1>${st.b}</div></section>
   <nav class="rail" aria-label="Steps"><div class="wrap">
    <a class="btn small" href="${prev}" id="prev">Back</a>
    <div class="dots">${c.steps.map((s,i)=>`<a href="#${c.s}-${i+1}" class="${i+1===n?'on':i<(seen[c.s]||0)?'seen':''}" aria-label="Step ${i+1}: ${s.t}"></a>`).join('')}</div>
    <a class="btn small primary" href="${nx}" id="next">${!last?'Next':ci<CH.length-1?'Next chapter':'Finish'}</a></div></nav>`;
  if(st.w){
    const host=$('#widget');
    if(hasDiagram){ // widget sits under the text instead, diagram keeps the stage
      const d=document.createElement('div');$('.copy').appendChild(d);W[st.w](d,st);
    }else W[st.w](host,st);
  }
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const b=e.key==='ArrowRight'?$('#next'):e.key==='ArrowLeft'?$('#prev'):null;
  if(b)location.hash=b.getAttribute('href');
});
$('#home-link').onclick=e=>{e.preventDefault();location.hash=''};
route();
</script>
<script>
/* GoatCounter: counts each chapter step as its own page (the guide uses #chapter-step links). */
window.goatcounter = {path: function(){ return location.pathname + location.search + location.hash }};
addEventListener('hashchange', function(){
  if (window.goatcounter && window.goatcounter.count)
    window.goatcounter.count({path: location.pathname + location.search + location.hash,
                              title: (document.getElementById('crumb').textContent || document.title).trim()});
});
</script>
<script data-goatcounter="https://howaiworks.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
